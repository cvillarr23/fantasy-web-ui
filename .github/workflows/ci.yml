name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Build
        run: npm run build

  publish-image:
    needs: build-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fantasy-web-ui:latest
            ghcr.io/${{ github.repository_owner }}/fantasy-web-ui:${{ github.sha }}

      - name: Log published image refs
        run: |
          echo "Published ghcr.io/${{ github.repository_owner }}/fantasy-web-ui:${{ github.sha }}"
          echo "Digest: ${{ steps.build_push.outputs.digest }}"

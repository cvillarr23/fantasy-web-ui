name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: fantasy-runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Unit tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Story tests
        run: npm run test:stories

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  publish-image:
    needs: build-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: fantasy-runners
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build_push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fantasy-web-ui:latest
            ghcr.io/${{ github.repository_owner }}/fantasy-web-ui:${{ github.sha }}

      - name: Log published image refs
        run: |
          echo "Published ghcr.io/${{ github.repository_owner }}/fantasy-web-ui:${{ github.sha }}"
          echo "Digest: ${{ steps.build_push.outputs.digest }}"

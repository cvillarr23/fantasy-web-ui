name: Notify docs site

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      # The site also publishes the Storybook component library built from these.
      - 'src/**'
      - '.storybook/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the docs site
        uses: cvillarr23/fantasy-project/.github/actions/dispatch-docs@4f7da926c63b74d3db9917cef547ccea8b074ef2
        with:
          token: ${{ secrets.DOCS_SITE_DISPATCH_TOKEN }}
